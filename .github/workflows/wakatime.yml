name: WakaTime Dashboard

# Regenerates assets/wakatime.svg from the WakaTime API and commits it when it changes.
# The API key lives in the WAKATIME_API_KEY repository secret and is only ever passed
# to the generator as an environment variable (GitHub masks it in logs).

on:
  schedule:
    - cron: '30 22 * * *'   # 03:30 Asia/Tashkent — previous day is complete
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wakatime-dashboard
  cancel-in-progress: false

jobs:
  update:
    name: Generate dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch WakaTime data and render SVG
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: node scripts/generate_wakatime.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wakatime.svg
          if git diff --cached --quiet; then
            echo "Dashboard unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update WakaTime dashboard"
          git push
