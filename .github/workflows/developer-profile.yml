name: Developer Profile

# Regenerates the profile images and commits them when they change:
#   assets/terminal.svg  terminal card — contribution graph, streaks, weekly activity, coding time
#   assets/profile.svg   full dashboard — WakaTime coding activity + GitHub repository intelligence
#
# Secrets
#   WAKATIME_API_KEY     WakaTime API key (required).
#   GH_PORTFOLIO_TOKEN   Fine-grained personal access token, read-only "Contents" + "Metadata" on all
#                        repositories. Enables private-repository analysis (output is anonymized).
#                        Optional: without it only public repositories are analyzed.
# Secrets reach the generator only as environment variables. They are never printed or rendered,
# and the generator aborts (nothing is committed) if any private identifier or token-like string
# would appear in the output.

on:
  schedule:
    - cron: '30 22 * * *'   # 03:30 Asia/Tashkent — previous day is complete
    - cron: '0 4,10,16 * * *'   # 09:00, 15:00, 21:00 Tashkent — keeps the contribution graph fresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developer-profile
  cancel-in-progress: false

jobs:
  update:
    name: Generate profile
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render terminal card
        id: terminal
        continue-on-error: true
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_PORTFOLIO_TOKEN: ${{ secrets.GH_PORTFOLIO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate_terminal.js

      - name: Fetch WakaTime + GitHub data and render SVG
        id: dashboard
        continue-on-error: true
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_PORTFOLIO_TOKEN: ${{ secrets.GH_PORTFOLIO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate_profile.js

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/
          if git diff --cached --quiet; then
            echo "Profile unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update developer profile"
          git push

      # One card failing must not block the other from being published, but the run still goes red.
      - name: Report failed generators
        if: steps.terminal.outcome == 'failure' || steps.dashboard.outcome == 'failure'
        run: |
          echo "terminal: ${{ steps.terminal.outcome }} · dashboard: ${{ steps.dashboard.outcome }}"
          exit 1
